syntax = "proto3";

package connector.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/InteractionLabs/traversal-connector/connector-lib/gen/connector/v1;connector";

// RawTunnelFrame is the envelope for every message on ConnectorService.RawTunnel.
//
// One raw tunnel is one bidirectional gRPC stream that multiplexes many pipes. A
// pipe is one outbound TCP connection from the connector to an authorized
// destination, carrying opaque bytes in both directions. The same envelope is
// used in both directions because every pipe frame (data, flow control,
// half-close, reset) is symmetric. Each frame documents which side may send it;
// a frame arriving from the wrong side is a protocol error that ends the tunnel.
message RawTunnelFrame {
  // The frame being sent. An unset or unknown frame is a protocol error that
  // ends the tunnel.
  oneof frame {
    option (buf.validate.oneof).required = true;

    // Connector to controller. The first frame on a new tunnel.
    RawConnectorHello connector_hello = 1;
    // Controller to connector. The reply to connector_hello.
    RawControllerHello controller_hello = 2;
    // Controller to connector. Requests a new pipe.
    RawOpen open = 3;
    // Connector to controller. The pipe's destination socket is connected.
    RawOpened opened = 4;
    // Connector to controller. The connector refused an open.
    RawOpenError open_error = 5;
    // Either direction. Pipe bytes.
    RawData data = 6;
    // Either direction. Grants the peer more send credit on a pipe.
    RawWindowUpdate window_update = 7;
    // Either direction. The sender will send no more data on a pipe.
    RawHalfClose half_close = 8;
    // Either direction. Aborts a pipe immediately.
    RawReset pipe_reset = 9;
    // Connector to controller. The connector released a pipe's resources.
    RawClose close = 10;
    // Either direction. The sender accepts no new pipes on this tunnel.
    RawDrain drain = 11;
    // Either direction. Tunnel keepalive.
    RawPing ping = 12;
  }
}

// RawConnectorHello is the connector's first frame on a raw tunnel. The
// controller refuses the tunnel if it supports none of the listed protocol
// versions.
message RawConnectorHello {
  // Every raw tunnel protocol version the connector implements.
  repeated uint32 supported_protocol_versions = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
  }];
  // The connector pod's hostname, recorded with pipe audit records.
  string hostname = 2 [(buf.validate.field).string.max_len = 253];
  // The most pipes the connector accepts concurrently on this tunnel.
  uint32 max_pipes = 3 [(buf.validate.field).uint32.gt = 0];
  // Key IDs of the capability signing keys the connector trusts, so the
  // controller can detect a key rollout the connector has not received.
  repeated string trusted_key_ids = 4 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  // Pipe modes the connector can open.
  repeated RawPipeMode supported_modes = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 8
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

// RawControllerHello accepts a raw tunnel.
message RawControllerHello {
  // The protocol version both sides use for the rest of the tunnel. It is one of
  // RawConnectorHello.supported_protocol_versions.
  uint32 protocol_version = 1 [(buf.validate.field).uint32.gt = 0];
  // The controller-assigned identifier for this tunnel. Pipe audit records are
  // keyed by (connector_id, tunnel_id, pipe_id).
  string tunnel_id = 2 [(buf.validate.field).string.uuid = true];
}

// RawOpen asks the connector to open a pipe to one exact destination.
message RawOpen {
  // Allocated by the controller, unique within the tunnel, and strictly
  // increasing, so a pipe ID is never reused on a tunnel.
  uint64 pipe_id = 1 [(buf.validate.field).uint64.gt = 0];
  // The signed connector capability, forwarded unchanged from the caller. The
  // connector verifies it independently before resolving or dialing anything.
  string capability = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  // The destination host in canonical form. It must equal the capability's
  // host exactly.
  string host = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
  }];
  // The destination port. It must equal the capability's port exactly.
  uint32 port = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 65535
  }];
  // How the connector carries the pipe's bytes.
  RawPipeMode mode = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// RawOpened reports that the connector connected the pipe's destination socket.
// The controller must not send data on a pipe before receiving it.
message RawOpened {
  // The pipe that opened.
  uint64 pipe_id = 1 [(buf.validate.field).uint64.gt = 0];
}

// RawOpenError reports that the connector refused an open. No bytes reached the
// destination, and the pipe ID is retired; no RawClose follows.
message RawOpenError {
  // The refused pipe.
  uint64 pipe_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Why the open was refused.
  RawOpenFailureReason reason = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // A fixed, payload-free explanation, such as the safety rule that refused the
  // destination. It never contains destination responses or capability values.
  string detail = 3 [(buf.validate.field).string.max_len = 256];
}

// RawData carries pipe bytes. Each payload byte spends one byte of the
// sender's send credit for that pipe.
message RawData {
  // The pipe the bytes belong to.
  uint64 pipe_id = 1 [(buf.validate.field).uint64.gt = 0];
  // The bytes, in order. Never empty and at most 32 KiB.
  bytes payload = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 32768
  }];
}

// RawWindowUpdate returns send credit to the peer after the sender's consumer
// has drained received bytes. Each direction of a pipe starts with 256 KiB of
// credit, and a sender's credit never exceeds that.
message RawWindowUpdate {
  // The pipe the credit applies to.
  uint64 pipe_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Bytes of additional credit.
  uint32 credit_bytes = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 262144
  }];
}

// RawHalfClose ends one direction of a pipe, like a TCP FIN. The sender sends no
// more data on the pipe; the opposite direction is unaffected.
message RawHalfClose {
  // The pipe whose sending direction ends.
  uint64 pipe_id = 1 [(buf.validate.field).uint64.gt = 0];
}

// RawReset aborts a pipe in both directions. The receiver closes the pipe's
// socket and discards buffered bytes.
message RawReset {
  // The aborted pipe.
  uint64 pipe_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Why the pipe was aborted.
  RawCloseReason reason = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// RawClose reports that the connector finished a pipe and released its socket
// and slot. The connector sends it exactly once for every pipe it opened or
// that was reset while opening. The controller counts a pipe against the
// tunnel's limit until it arrives, so the two sides never disagree about how
// many pipes are open.
message RawClose {
  // The finished pipe.
  uint64 pipe_id = 1 [(buf.validate.field).uint64.gt = 0];
  // How the pipe ended.
  RawCloseReason reason = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// RawDrain stops new pipes on the tunnel. Pipes already open continue until they
// end. The connector opens a replacement tunnel when it receives or sends one.
message RawDrain {
  // Why the tunnel is draining.
  RawDrainReason reason = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// RawPing keeps an idle tunnel alive through intermediaries that close quiet
// streams, and detects a dead peer.
message RawPing {
  // An opaque value echoed in the acknowledgement.
  uint64 nonce = 1;
  // True when this frame acknowledges a received ping.
  bool ack = 2;
}

// RawPipeMode selects how the connector carries a pipe's bytes.
enum RawPipeMode {
  // Not set. Never valid.
  RAW_PIPE_MODE_UNSPECIFIED = 0;
  // Bytes are relayed opaquely; the connector does not inspect or alter them.
  RAW_PIPE_MODE_PASSTHROUGH = 1;
}

// RawOpenFailureReason explains why a pipe could not be opened. No bytes reached
// the destination for any of these reasons.
enum RawOpenFailureReason {
  // Not set. Never valid.
  RAW_OPEN_FAILURE_REASON_UNSPECIFIED = 0;
  // The capability is malformed, has an invalid signature or issuer, or carries
  // claims the verifier does not accept.
  RAW_OPEN_FAILURE_REASON_INVALID_CAPABILITY = 1;
  // The capability is expired or not yet valid.
  RAW_OPEN_FAILURE_REASON_CAPABILITY_EXPIRED = 2;
  // The capability was issued for a different audience.
  RAW_OPEN_FAILURE_REASON_WRONG_AUDIENCE = 3;
  // The capability was signed with a key the verifier does not trust.
  RAW_OPEN_FAILURE_REASON_UNKNOWN_KEY = 4;
  // The capability is valid but its subject or tenant is not permitted here.
  RAW_OPEN_FAILURE_REASON_FORBIDDEN = 5;
  // The capability authorizes a different connector.
  RAW_OPEN_FAILURE_REASON_WRONG_CONNECTOR = 6;
  // The requested destination differs from the capability's destination.
  RAW_OPEN_FAILURE_REASON_WRONG_DESTINATION = 7;
  // The capability's pipe mode is not supported.
  RAW_OPEN_FAILURE_REASON_UNSUPPORTED_MODE = 8;
  // The capability has opened the maximum number of pipes allowed.
  RAW_OPEN_FAILURE_REASON_CAPABILITY_EXHAUSTED = 9;
  // The destination requires connector-side payload inspection, which raw
  // pipes cannot provide.
  RAW_OPEN_FAILURE_REASON_INSPECTION_REQUIRED = 10;
  // The destination resolves to an address the connector never dials.
  RAW_OPEN_FAILURE_REASON_FORBIDDEN_ADDRESS = 11;
  // The destination hostname did not resolve.
  RAW_OPEN_FAILURE_REASON_DNS_FAILED = 12;
  // Connecting to the destination, directly or through a forward proxy, failed.
  RAW_OPEN_FAILURE_REASON_DIAL_FAILED = 13;
  // A pipe, tunnel, or tenant capacity limit is reached.
  RAW_OPEN_FAILURE_REASON_CAPACITY = 14;
  // The tunnel or connector is draining and accepts no new pipes.
  RAW_OPEN_FAILURE_REASON_CONNECTOR_DRAINING = 15;
  // No compatible raw tunnel exists for the capability's connector.
  RAW_OPEN_FAILURE_REASON_NO_RAW_TUNNEL = 16;
  // The pipe did not open within the open timeout.
  RAW_OPEN_FAILURE_REASON_OPEN_TIMEOUT = 17;
  // The open request violated the protocol.
  RAW_OPEN_FAILURE_REASON_PROTOCOL_ERROR = 18;
}

// RawCloseReason explains how an opened pipe ended.
enum RawCloseReason {
  // Not set. Never valid.
  RAW_CLOSE_REASON_UNSPECIFIED = 0;
  // Both directions half-closed normally.
  RAW_CLOSE_REASON_COMPLETED = 1;
  // The caller cancelled or abandoned the pipe.
  RAW_CLOSE_REASON_CANCELLED = 2;
  // The destination socket failed.
  RAW_CLOSE_REASON_UPSTREAM_ERROR = 3;
  // No bytes moved in either direction for the idle timeout.
  RAW_CLOSE_REASON_IDLE_TIMEOUT = 4;
  // The pipe reached its maximum lifetime.
  RAW_CLOSE_REASON_MAX_LIFETIME = 5;
  // A controller pod shut down before the pipe ended.
  RAW_CLOSE_REASON_CONTROLLER_TERMINATING = 6;
  // A connector pod shut down before the pipe ended.
  RAW_CLOSE_REASON_CONNECTOR_TERMINATING = 7;
  // The raw tunnel carrying the pipe was lost.
  RAW_CLOSE_REASON_TUNNEL_LOST = 8;
  // A peer violated the pipe protocol, for example by exceeding its send
  // credit.
  RAW_CLOSE_REASON_PROTOCOL_ERROR = 9;
}

// RawDrainReason explains why a tunnel stopped accepting new pipes.
enum RawDrainReason {
  // Not set. Never valid.
  RAW_DRAIN_REASON_UNSPECIFIED = 0;
  // The tunnel reached its lifetime and is being replaced to rebalance load.
  RAW_DRAIN_REASON_ROTATION = 1;
  // The sending pod is shutting down.
  RAW_DRAIN_REASON_SHUTDOWN = 2;
}
