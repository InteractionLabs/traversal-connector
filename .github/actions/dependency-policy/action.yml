name: Enforce dependency policy
description: Validate repository policy and changed dependency publication times
inputs:
  pull-request-base-sha:
    description: Base commit from the pull request event; replaced by the merge-base with pull-request-base-ref when it no longer exists
    required: false
    default: ""
  pull-request-base-ref:
    description: Base branch name from the pull request event
    required: false
    default: ""
  merge-group-base-sha:
    description: Base commit from the merge group event
    required: false
    default: ""
  event-name:
    description: Name of the triggering event
    required: false
    default: ""
  push-before-sha:
    description: Commit the branch pointed to before a push event
    required: false
    default: ""
  default-branch:
    description: Default branch of the repository, the fallback base for pushes
    required: false
    default: ""
  require-caller:
    description: Require the repository-level reusable workflow caller
    required: false
    default: "true"
  caller-repository:
    description: Repository that owns the trusted reusable workflow
    required: false
    default: InteractionLabs/infrastructure
  output:
    description: JSON evidence report path
    required: false
    default: dependency-policy-results.json
  cache:
    description: Publication evidence cache path
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate dependency policy wiring
      shell: bash
      env:
        INPUT_REQUIRE_CALLER: ${{ inputs.require-caller }}
        INPUT_CALLER_REPOSITORY: ${{ inputs.caller-repository }}
        INPUT_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        arguments=(
          --repo "$GITHUB_WORKSPACE"
          --repository "$INPUT_REPOSITORY"
          --caller-repository "$INPUT_CALLER_REPOSITORY"
        )
        if [[ "$INPUT_REQUIRE_CALLER" == "true" ]]; then
          arguments+=(--require-caller)
        fi
        python3 -I "$GITHUB_ACTION_PATH/repository_invariants.py" "${arguments[@]}"
    - name: Resolve comparison commits
      id: comparison
      shell: bash
      env:
        EVENT_BASE_SHA: ${{ inputs.pull-request-base-sha }}
        EVENT_BASE_REF: ${{ inputs.pull-request-base-ref }}
        EVENT_MERGE_GROUP_BASE_SHA: ${{ inputs.merge-group-base-sha }}
        EVENT_NAME: ${{ inputs.event-name }}
        EVENT_PUSH_BEFORE_SHA: ${{ inputs.push-before-sha }}
        EVENT_DEFAULT_BRANCH: ${{ inputs.default-branch }}
      run: python3 -I "$GITHUB_ACTION_PATH/resolve_base.py"
    - name: Enforce dependency publication age
      shell: bash
      env:
        INPUT_BASE_SHA: ${{ steps.comparison.outputs.base }}
        INPUT_HEAD_SHA: ${{ steps.comparison.outputs.head }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail
        arguments=(
          --repo "$GITHUB_WORKSPACE"
          --base "$INPUT_BASE_SHA"
          --head "$INPUT_HEAD_SHA"
          --output "$INPUT_OUTPUT"
        )
        if [[ -n "$INPUT_CACHE" ]]; then
          arguments+=(--cache "$INPUT_CACHE")
        fi
        python3 -I "$GITHUB_ACTION_PATH/policy.py" "${arguments[@]}"
