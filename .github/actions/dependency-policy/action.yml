name: Enforce dependency policy
description: Validate repository policy and changed dependency publication times
inputs:
  base-sha:
    description: Merge-base commit to compare
    required: true
  head-sha:
    description: Commit containing proposed dependency changes
    required: true
  require-caller:
    description: Require the repository-level reusable workflow caller
    required: false
    default: "true"
  caller-repository:
    description: Repository that owns the trusted reusable workflow
    required: false
    default: InteractionLabs/infrastructure
  output:
    description: JSON evidence report path
    required: false
    default: dependency-policy-results.json
  cache:
    description: Publication evidence cache path
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate dependency policy wiring
      shell: bash
      env:
        INPUT_REQUIRE_CALLER: ${{ inputs.require-caller }}
        INPUT_CALLER_REPOSITORY: ${{ inputs.caller-repository }}
      run: |
        set -euo pipefail
        arguments=(
          --repo "$GITHUB_WORKSPACE"
          --caller-repository "$INPUT_CALLER_REPOSITORY"
        )
        if [[ "$INPUT_REQUIRE_CALLER" == "true" ]]; then
          arguments+=(--require-caller)
        fi
        python3 "$GITHUB_ACTION_PATH/repository_invariants.py" "${arguments[@]}"
    - name: Enforce dependency publication age
      shell: bash
      env:
        INPUT_BASE_SHA: ${{ inputs.base-sha }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail
        arguments=(
          --repo "$GITHUB_WORKSPACE"
          --base "$INPUT_BASE_SHA"
          --head "$INPUT_HEAD_SHA"
          --output "$INPUT_OUTPUT"
        )
        if [[ -n "$INPUT_CACHE" ]]; then
          arguments+=(--cache "$INPUT_CACHE")
        fi
        python3 "$GITHUB_ACTION_PATH/policy.py" "${arguments[@]}"
