name: Sign Image

# Keep this file byte-identical to InteractionLabs/traversal-connector's copy.
# workflow_dispatch is for on-demand backfill signing (e.g. pull-through-cache), not a second
# signing path — it shares the same role and key as workflow_call.
on:
  workflow_call:
    inputs:
      repo:
        description: "ECR repository name in 885, without registry host (e.g. pgproxy, trailblazer/baler)"
        required: true
        type: string
      digest:
        description: "Image digest (sha256:...) or a mutable tag to resolve to a digest before signing"
        required: true
        type: string
      registry:
        description: "Container registry host"
        required: false
        type: string
        default: "885798945817.dkr.ecr.us-west-2.amazonaws.com"
      wiz_enforce:
        description: "Fail the job on a Wiz policy violation instead of scanning observe-only. Leave false during fleet rollout."
        type: boolean
        default: false
    secrets:
      # Temporarily optional: cross-repo callers can't pass these until Wiz creds are
      # provisioned as InteractionLabs org secrets. Re-tighten to required: true after.
      WIZ_CLIENT_ID:
        description: "Wiz service-account client ID"
        required: false
      WIZ_CLIENT_SECRET:
        description: "Wiz service-account client secret"
        required: false
      REGISTRY_USERNAME:
        description: "Username for a non-ECR registry"
        required: false
      REGISTRY_PASSWORD:
        description: "Password or token for a non-ECR registry"
        required: false
  workflow_dispatch:
    inputs:
      repo:
        description: "ECR repository name in 885, without registry host (e.g. pgproxy, trailblazer/baler)"
        required: true
        type: string
      digest:
        description: "Image digest (sha256:...) or a mutable tag to resolve to a digest before signing"
        required: true
        type: string

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 885798945817.dkr.ecr.us-west-2.amazonaws.com
  PRIVATE_REPO_SIGNER_ROLE_ARN: arn:aws:iam::885798945817:role/image-signing
  PUBLIC_REPO_SIGNER_ROLE_ARN: arn:aws:iam::885798945817:role/public-repo-image-signing
  # Must match local.ptc_cache_prefix (terraform/global/container_images/ecr_ptc_new.tf and
  # terraform/global/container-images-iam/ecr_ci_roles.tf).
  PTC_PREFIX: ptc-533

permissions:
  id-token: write
  contents: read

jobs:
  sign:
    name: Sign image
    runs-on: [depot-ubuntu-24.04-arm]
    steps:
      # Inputs are interpolated into shell below; validate charset first to block injection
      # via a crafted repo/digest.
      - name: Validate inputs
        env:
          CALLER_REPO: ${{ github.repository }}
          REGISTRY: ${{ inputs.registry || env.ECR_REGISTRY }}
          REPO: ${{ inputs.repo }}
          DIGEST: ${{ inputs.digest }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! [[ "$REGISTRY" =~ ^[a-z0-9][a-z0-9.-]*(:[0-9]+)?$ ]]; then
            echo "::error::invalid registry: $REGISTRY" >&2
            exit 1
          fi
          if ! [[ "$REPO" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "::error::invalid repo: $REPO" >&2
            exit 1
          fi
          if [[ "$CALLER_REPO" == "InteractionLabs/traversal-connector" ]]; then
            if [[ "$REGISTRY" != "docker.io" || "$REPO" != "traversalext/traversal-connector" || ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::traversal-connector may sign only docker.io/traversalext/traversal-connector at an immutable digest" >&2
              exit 1
            fi
            if [[ -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ]]; then
              echo "::error::REGISTRY_USERNAME and REGISTRY_PASSWORD are required for $REGISTRY" >&2
              exit 1
            fi
          elif [[ "$REGISTRY" != "$ECR_REGISTRY" ]]; then
            echo "::error::caller $CALLER_REPO is not authorized to use registry: $REGISTRY" >&2
            exit 1
          elif ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$DIGEST" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::invalid digest or tag: $DIGEST" >&2
            exit 1
          fi

      # Confused-deputy guard: without this, any admitted workflow_call caller could pass
      # another team's `repo` and sign/re-sign their image, since image-signing's OIDC trust
      # spans ~8 subjects across 6 repos. `github.repository` is the CALLER's repo in a reusable
      # workflow, so it's a reliable key. Fail closed: an unlisted caller or repo is rejected,
      # not silently admitted. (Exemption logic — and why it keys on the repo, not the event —
      # is explained on the step below.)
      - name: Authorize caller for repo
        # In a reusable workflow github.event_name is the CALLER's top-level trigger, not
        # 'workflow_call' — so a producer dispatching its own build would evade a bare
        # `!= workflow_dispatch` check. Only a genuine admin backfill (dispatch of THIS
        # workflow, which runs in the infrastructure repo) is exempt; every cross-repo
        # caller is authorized regardless of its trigger.
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.repository == 'InteractionLabs/infrastructure') }}
        env:
          CALLER_REPO: ${{ github.repository }}
          REPO: ${{ inputs.repo }}
          REGISTRY: ${{ inputs.registry || env.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          case "$CALLER_REPO" in
            InteractionLabs/traversal)
              ALLOWED='^(traversal-fastapi|traversal-sandbox|tjc)$'
              ;;
            InteractionLabs/traversal-next-app)
              ALLOWED='^traversal-ui$'
              ;;
            InteractionLabs/splashmountain)
              ALLOWED='^(combine|trailblazer/.*)$'
              ;;
            InteractionLabs/db-migrations)
              ALLOWED='^traversal-migrations$'
              ;;
            InteractionLabs/go-traversal)
              ALLOWED='^(relay/.*|traversal-monitoring)$'
              ;;
            InteractionLabs/infrastructure)
              ALLOWED='^(pgproxy|arc-runner-traversal|dmarc/parsedmarc-lambda|static-web-pages|gvisor-installer)$'
              ;;
            InteractionLabs/traversal-connector)
              ALLOWED='^traversalext/traversal-connector$'
              ;;
            *)
              echo "::error::caller $CALLER_REPO is not in the sign-image.yaml allow-map" >&2
              exit 1
              ;;
          esac
          if ! [[ "$REPO" =~ $ALLOWED ]]; then
            echo "::error::caller $CALLER_REPO is not authorized to sign repo: $REPO" >&2
            exit 1
          fi
          if [[ "$CALLER_REPO" == "InteractionLabs/traversal-connector" && "$REGISTRY" != "docker.io" ]]; then
            echo "::error::caller $CALLER_REPO is not authorized to use registry: $REGISTRY" >&2
            exit 1
          fi

      # Each signer role trusts only its repository visibility's copy of this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ github.repository == 'InteractionLabs/traversal-connector' && env.PUBLIC_REPO_SIGNER_ROLE_ARN || env.PRIVATE_REPO_SIGNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        if: ${{ (inputs.registry || env.ECR_REGISTRY) == env.ECR_REGISTRY }}
      - name: Log in to container registry
        if: ${{ (inputs.registry || env.ECR_REGISTRY) != env.ECR_REGISTRY }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve digest
        id: resolve
        env:
          REPO: ${{ inputs.repo }}
          DIGEST: ${{ inputs.digest }}
          REGISTRY: ${{ inputs.registry || env.ECR_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          REF="$DIGEST"
          if [[ "$REGISTRY" != "$ECR_REGISTRY" ]]; then
            if [[ -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ]]; then
              echo "::error::REGISTRY_USERNAME and REGISTRY_PASSWORD are required for $REGISTRY" >&2
              exit 1
            fi
            if [[ ! "$REF" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::non-ECR registries require an immutable sha256 digest" >&2
              exit 1
            fi
          elif [[ "$REF" != sha256:* ]]; then
            REF="$(aws ecr describe-images \
              --repository-name "$REPO" \
              --image-ids imageTag="$REF" \
              --query 'imageDetails[0].imageDigest' --output text)"
          fi
          echo "digest=${REF}" >> "$GITHUB_OUTPUT"

      # The dispatch path signs pre-existing 533 digests that were never natively
      # pushed to 885, so check whether this digest already lives under the bare
      # 885 repo path. workflow_call never hits this — every build-time digest is
      # a fresh native push — so it's guarded to workflow_dispatch only.
      - name: Check for a native 885 push
        id: native_check
        if: github.event_name == 'workflow_dispatch' && github.repository == 'InteractionLabs/infrastructure'
        env:
          REPO: ${{ inputs.repo }}
          RESOLVED_DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          if aws ecr batch-get-image \
               --repository-name "$REPO" \
               --image-ids imageDigest="$RESOLVED_DIGEST" \
               --query 'images[0].imageId.imageDigest' --output text 2>/dev/null \
               | grep -qx "$RESOLVED_DIGEST"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

      # Not already native: force-materialize it under the PTC prefix first (885's
      # 533-upstream pull-through-cache rule). Switches to migration-backfill — the
      # pull-only role scoped to the PTC cache namespace — since image-signing has
      # no ecr:BatchImportUpstreamImage. Switched back to image-signing after, since
      # only that role can sign.
      - name: Configure AWS credentials (PTC puller)
        if: github.event_name == 'workflow_dispatch' && github.repository == 'InteractionLabs/infrastructure' && steps.native_check.outputs.native == 'false'
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: arn:aws:iam::885798945817:role/migration-backfill
          aws-region: ${{ env.AWS_REGION }}

      # The earlier login's ECR token is bound to image-signing; after switching to
      # migration-backfill the docker pull needs a token minted under that role.
      - name: Log in to Amazon ECR (PTC puller)
        if: github.event_name == 'workflow_dispatch' && github.repository == 'InteractionLabs/infrastructure' && steps.native_check.outputs.native == 'false'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Materialize digest through the PTC cache
        if: github.event_name == 'workflow_dispatch' && github.repository == 'InteractionLabs/infrastructure' && steps.native_check.outputs.native == 'false'
        env:
          REPO: ${{ inputs.repo }}
          RESOLVED_DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${ECR_REGISTRY}/${PTC_PREFIX}/${REPO}@${RESOLVED_DIGEST}"

      - name: Configure AWS credentials (signer)
        if: github.event_name == 'workflow_dispatch' && github.repository == 'InteractionLabs/infrastructure' && steps.native_check.outputs.native == 'false'
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ env.PRIVATE_REPO_SIGNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Re-login under image-signing so cosign's registry auth matches the signer
      # role again (the PTC-puller token above was scoped to migration-backfill).
      - name: Log in to Amazon ECR (signer)
        if: github.event_name == 'workflow_dispatch' && github.repository == 'InteractionLabs/infrastructure' && steps.native_check.outputs.native == 'false'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Resolve image ref
        id: ref
        env:
          REPO: ${{ inputs.repo }}
          RESOLVED_DIGEST: ${{ steps.resolve.outputs.digest }}
          REGISTRY: ${{ inputs.registry || env.ECR_REGISTRY }}
          NATIVE: ${{ steps.native_check.outputs.native }}
        run: |
          set -euo pipefail
          # native_check only runs for the admin infra-repo dispatch (backfill); its
          # output is empty (not "false") for every producer caller, so they always
          # take the unchanged native path.
          if [[ "$REGISTRY" == "$ECR_REGISTRY" && "$NATIVE" == "false" ]]; then
            REPO="${PTC_PREFIX}/${REPO}"
          fi
          echo "image=${REGISTRY}/${REPO}@${RESOLVED_DIGEST}" >> "$GITHUB_OUTPUT"

      # Everything below scans and signs steps.ref.outputs.image — the same string — so a
      # KMS signature is proof the exact scanned digest is what got signed.
      #
      # The `secrets` context isn't readable from step `if:` (only from env/with), so
      # presence is checked here in a run step and handed to later steps as an output.
      - name: Check Wiz credentials
        id: wizcheck
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "$WIZ_CLIENT_ID" && -n "$WIZ_CLIENT_SECRET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WIZ_CLIENT_ID/WIZ_CLIENT_SECRET not set (caller likely missing 'secrets: inherit') — skipping Wiz scan, signing proceeds unscanned"
          fi

      # Wiz signing key embedded (base64) instead of checked out: a reusable-workflow
      # `actions/checkout` grabs the CALLER's repo, which won't have a committed key file,
      # so cross-repo callers failed the import. continue-on-error mirrors wiz_enforce —
      # in observe mode a Wiz tooling/verification failure is loud but non-blocking (never
      # reds an unrelated build); in enforce mode it blocks before signing. Trust anchor:
      # Wiz signing key 61DF4068 0AB1A80E 51503B61 CE4AE4BA D12EE02C.
      - name: Install wizcli (GPG + sha256 verified)
        if: steps.wizcheck.outputs.enabled == 'true'
        continue-on-error: ${{ !inputs.wiz_enforce }}
        run: |
          set -euo pipefail
          echo "" | base64 -d > /tmp/wizcli-public-key.asc
          gpg --import /tmp/wizcli-public-key.asc
          curl -fsSL -o /tmp/wizcli-sha256 https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-arm64-sha256
          curl -fsSL -o /tmp/wizcli-sha256.sig https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-arm64-sha256.sig
          gpg --verify /tmp/wizcli-sha256.sig /tmp/wizcli-sha256
          curl -fsSL -o wizcli.gz https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-arm64.gz
          gunzip wizcli.gz
          echo "$(cat /tmp/wizcli-sha256)  wizcli" | sha256sum -c -
          chmod +x wizcli
          sudo install -m 0755 wizcli /usr/local/bin/wizcli

      - name: Wiz auth
        if: steps.wizcheck.outputs.enabled == 'true'
        continue-on-error: ${{ !inputs.wiz_enforce }}
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"

      - name: Wiz scan
        if: steps.wizcheck.outputs.enabled == 'true'
        # Always evaluates POLICY; continue-on-error keeps findings non-blocking in observe
        # mode and lets them fail the job (before signing) once wiz_enforce is on.
        continue-on-error: ${{ !inputs.wiz_enforce }}
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          POLICY: "Default vulnerabilities policy"
          ECR_REPO: ${{ inputs.repo }}
          RESOLVED_DIGEST: ${{ steps.resolve.outputs.digest }}
          # The github context in a reusable workflow is the CALLER's (see the authorize
          # step above), so these attribute the scan to the producing repo and commit.
          CALLER_REPO: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_NAME: ${{ github.ref_name }}
          CALLER_REF_TYPE: ${{ github.ref_type }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_ACTOR: ${{ github.actor }}
          CALLER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # wizcli scan container-image inspects a LOCAL image, so pull the pushed
          # digest first (the job is already ECR-authed to 885 from the login step).
          docker pull "$IMAGE"

          # Wiz names scan records after the target, which is a bare digest — so scans can't
          # be grouped by producer repo, image, or branch without extra metadata. --tags is
          # the groupable dimension on Findings > Code & Build Scans. Tag KEYS must be >=3
          # chars, start with a lowercase letter, and use only [a-z0-9/._-]; values are free.
          default_branch="${CALLER_DEFAULT_BRANCH:-main}"
          case "$CALLER_REF" in
            "refs/heads/${default_branch}") branch_class=mainline ;;
            refs/heads/*)                   branch_class=feature ;;
            refs/tags/*)                    branch_class=release-tag ;;
            refs/pull/*)                    branch_class=pull-request ;;
            *)                              branch_class=other ;;
          esac

          # Feature-detect before use: an unrecognised flag is a hard wizcli error, which
          # would block the build once wiz_enforce is on.
          help="$(wizcli scan container-image --help 2>&1 || true)"
          args=(scan container-image "$IMAGE" --policies "$POLICY")

          if [[ "$help" == *--name* ]]; then
            args+=(--name "${CALLER_REPO}/${ECR_REPO}@${RESOLVED_DIGEST:7:12}")
          fi

          if [[ "$help" == *--tags* ]]; then
            add_tag() { if [[ -n "${2:-}" ]]; then args+=(--tags "$1=$2"); fi; }
            add_tag github-repository "$CALLER_REPO"
            add_tag github-branch     "$CALLER_REF_NAME"
            add_tag github-ref-type   "$CALLER_REF_TYPE"
            add_tag branch-class      "$branch_class"
            add_tag github-commit     "$CALLER_SHA"
            add_tag github-workflow   "$CALLER_WORKFLOW"
            add_tag github-event      "$CALLER_EVENT"
            add_tag github-actor      "$CALLER_ACTOR"
            add_tag github-run-url    "$RUN_URL"
            add_tag ecr-repository    "$ECR_REPO"
            add_tag image-digest      "$RESOLVED_DIGEST"
            add_tag scan-source       sign-image
          fi

          # `|| true` on this pipeline would reset PIPESTATUS (running `true` as the
          # fallback overwrites it), so disable errexit around it instead to read
          # wizcli's real exit code before restoring set -e.
          set +e
          wizcli "${args[@]}" 2>&1 | tee /tmp/wiz-scan.out
          scan_exit="${PIPESTATUS[0]}"
          set -e

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            verdict=$(grep -m1 'Verdict:' /tmp/wiz-scan.out | sed -E 's/^[[:space:]]+//') || true
            failed_policies=$(grep -m1 'Failed Policies:' /tmp/wiz-scan.out | sed -E 's/^[[:space:]]+//') || true
            cloud_event_url=$(grep -m1 -oE 'https://app\.wiz\.io[^[:space:]]*' /tmp/wiz-scan.out) || true

            {
              echo "### Wiz scan"
              echo
              echo "- **Image:** \`$IMAGE\`"
              echo "- **Source:** \`$CALLER_REPO\` @ \`$CALLER_REF_NAME\` ($branch_class), commit \`${CALLER_SHA:0:8}\`"
              [[ -n "$verdict" ]] && echo "- $verdict" || true
              [[ -n "$failed_policies" ]] && echo "- $failed_policies" || true
              [[ -n "$cloud_event_url" ]] && echo "- [Wiz Cloud Event]($cloud_event_url)" || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$scan_exit"

      # Associates the scanned image with the Wiz Security Graph (enrichment); best-effort.
      - name: Wiz graph enrichment
        if: steps.wizcheck.outputs.enabled == 'true'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: wizcli tag "$IMAGE"

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            --key awskms:///alias/ecr-image-signing \
            "$IMAGE"
