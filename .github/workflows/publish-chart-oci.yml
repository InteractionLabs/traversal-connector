name: Mirror release chart to OCI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing GitHub Release version (vX.Y.Z)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-chart-oci-${{ inputs.version }}
  cancel-in-progress: false

env:
  HELM_VERSION: v3.18.6

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Helm
        run: |
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar --extract --gzip --strip-components=1 --directory=/usr/local/bin linux-amd64/helm
          helm version --short

      - name: Download and verify GitHub Release chart
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vX.Y.Z, got: $VERSION" >&2
            exit 1
          fi
          chart="traversal-connector-charts-${VERSION#v}.tgz"
          mkdir -p dist
          gh release download "$VERSION" \
            --dir dist \
            --pattern "$chart" \
            --pattern "$chart.sha256"
          test -f "dist/$chart"
          test -f "dist/$chart.sha256"
          (cd dist && sha256sum --check "$chart.sha256")

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: traversalext
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish and verify OCI chart mirror
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/publish-chart-oci.sh "dist/traversal-connector-charts-${VERSION#v}.tgz"
