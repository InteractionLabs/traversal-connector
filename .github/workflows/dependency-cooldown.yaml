name: dependency-cooldown

on:
  workflow_call:
    inputs:
      base-sha:
        description: Merge-base commit to compare
        required: false
        type: string
      head-sha:
        description: Commit containing proposed dependency changes
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  dependency-cooldown:
    name: dependency-cooldown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout proposed repository state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve comparison commits
        id: comparison
        env:
          INPUT_BASE: ${{ inputs.base-sha }}
          INPUT_HEAD: ${{ inputs.head-sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE:-${PR_BASE:-${QUEUE_BASE:-}}}"
          head="${INPUT_HEAD:-${PR_HEAD:-${QUEUE_HEAD:-HEAD}}}"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          git cat-file -e "${head}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Authenticate evidence writer
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.0.0
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::833319601877:role/s3-dependency-evidence-traversal-connector-writer-role
          role-session-name: dependency-evidence-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enforce dependency policy
        uses: InteractionLabs/traversal-connector/.github/actions/dependency-cooldown@7050e2fb241689dcadd0d816b4f1011f1c98c1e1 # policy-v1
        with:
          base-sha: ${{ steps.comparison.outputs.base }}
          head-sha: ${{ steps.comparison.outputs.head }}
          require-caller: "false"
        env:
          DEPENDENCY_EVIDENCE_BUCKET: traversal-dependency-evidence-833319601877-us-west-2

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-cooldown-results
          path: dependency-cooldown-results.json
          if-no-files-found: warn
