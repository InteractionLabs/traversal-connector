name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        type: choice
        options: [major, minor, patch]
        default: patch
      description:
        description: 'Description of the release (release notes)'
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE: traversalext/traversal-connector
  HELM_VERSION: v3.18.6

jobs:
  prepare:
    # Run on manual dispatch, or when a PR is merged carrying a release:* label.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && (
        contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch')))
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Determine bump and release notes
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_DESC: ${{ github.event.inputs.description }}
          LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bump="$INPUT_BUMP"
            notes="$INPUT_DESC"
          else
            if echo "$LABELS" | jq -e '.[] | select(.name == "release:major")' > /dev/null; then
              bump='major'
            elif echo "$LABELS" | jq -e '.[] | select(.name == "release:minor")' > /dev/null; then
              bump='minor'
            else
              bump='patch'
            fi
            # Release notes are the top-level "# Release Notes" section of the PR
            # body, enforced by the Release Notes Check workflow. Fail loudly if
            # it is missing rather than publishing an arbitrary body as notes.
            section=$(printf '%s\n' "$PR_BODY" | .github/scripts/extract-release-notes.sh)
            if [[ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]]; then
              echo "::error::Merged PR has a release:* label but no non-empty '# Release Notes' section."
              exit 1
            fi
            notes="$section"
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute new version
        id: version
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ steps.meta.outputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Previous: $latest -> New: $version"

  build:
    needs: prepare
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          # Pull public base images (golang, alpine) anonymously via a
          # pull-through mirror. The scoped DOCKERHUB_TOKEN can push to our
          # repo but lacks pull scope on library/* images, so without this
          # buildkit's authenticated base-image pulls fail with 401.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: traversalext
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: production
          push: true
          sbom: true
          provenance: mode=max
          # Push an untagged manifest by digest. The version tag is attached only
          # after this exact digest has passed scanning and signing.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

  sign:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/public-sign-image.yml
    with:
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

  package-chart:
    needs: prepare
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install Helm
        run: |
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar --extract --gzip --strip-components=1 --directory=/usr/local/bin linux-amd64/helm
          helm version --short

      - name: Validate and package chart
        run: just chart-package "${{ needs.prepare.outputs.version }}"

      - name: Upload chart workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-chart
          path: |
            dist/*.tgz
            dist/*.tgz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build, sign, package-chart]
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: traversalext
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Helm
        run: |
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar --extract --gzip --strip-components=1 --directory=/usr/local/bin linux-amd64/helm
          helm version --short

      - name: Download chart workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-chart
          path: dist

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.notes }}
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          chart_version=${VERSION#v}
          chart="traversal-connector-charts-${chart_version}.tgz"
          checksum="${chart}.sha256"
          test -f "dist/$chart"
          test -f "dist/$checksum"
          (cd dist && sha256sum --check "$checksum")

          tag_cleanup_needed=false
          draft_created=false
          published=false
          cleanup() {
            status=$?
            if [[ "$status" -ne 0 && "$published" != true ]]; then
              if [[ "$draft_created" == true ]]; then
                echo "Removing incomplete draft release $VERSION."
                gh release delete "$VERSION" --yes || true
              fi
              if [[ "$tag_cleanup_needed" == true ]]; then
                echo "Rolling back Git tag $VERSION."
                git push origin ":refs/tags/$VERSION" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          git tag -a "$VERSION" -m "$NOTES"
          # Arm cleanup before the push to close the process-termination window;
          # deleting a remote ref that was never created is harmless.
          tag_cleanup_needed=true
          git push origin "$VERSION"

          gh release create "$VERSION" --draft --title "$VERSION" --notes "$NOTES" --verify-tag
          draft_created=true
          gh release upload "$VERSION" "dist/$chart" "dist/$checksum"

          asset_names=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
          test "$(printf '%s\n' "$asset_names" | grep -Fxc "$chart")" -eq 1
          test "$(printf '%s\n' "$asset_names" | grep -Fxc "$checksum")" -eq 1

          mkdir verified-assets
          gh release download "$VERSION" --dir verified-assets --pattern "$chart" --pattern "$checksum"
          test -f "verified-assets/$chart"
          test -f "verified-assets/$checksum"
          (cd verified-assets && sha256sum --check "$checksum")

          # Transitional compatibility mirror. Keep GitHub assets canonical,
          # but fail while the GitHub Release is still a draft if OCI
          # publication or verification does not succeed.
          scripts/publish-chart-oci.sh "verified-assets/$chart"

          # Apply the public image tag only after the draft contains verified
          # release assets. The digest was already scanned and signed. GitHub
          # and Docker Hub cannot publish transactionally: if publishing the
          # draft fails next, cleanup removes the draft and Git tag, but this
          # already-validated public image tag may remain for the retry.
          docker buildx imagetools create \
            --tag "${IMAGE_REF}:${VERSION}" \
            "${IMAGE_REF}@${DIGEST}"

          gh release edit "$VERSION" --draft=false --latest
          published=true
          trap - EXIT
