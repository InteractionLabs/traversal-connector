name: Release

# Releases are only ever dispatched by a person: merging a PR releases
# nothing. The version is given, not computed, and validated before anything is
# built. This chart and image are installed into customers' own networks, so an
# accidental release is not cheap to take back.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, e.g. v0.10.1: the next version of an existing line'
        type: string
        required: true
      description:
        description: 'Release notes'
        type: string
        required: true
      latest:
        description: "Mark this release as GitHub's Latest (main only)"
        type: boolean
        default: true
      dry_run:
        description: 'Validate and print the plan only: build and publish nothing'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE: traversalext/traversal-connector
  AWS_REGION: us-west-2
  PUBLIC_REPO_SIGNER_ROLE_ARN: arn:aws:iam::885798945817:role/public-repo-image-signing
  HELM_VERSION: v3.18.6
  HELM_SHA256_AMD64: 3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce
  HELM_SHA256_ARM64: 5b8e00b6709caab466cbbb0bc29ee09059b8dc9417991dd04b497530e49b1737
  KIND_SHA256_AMD64: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
  KIND_SHA256_ARM64: 7ea2de9d2d190022ed4a8a4e3ac0636c8a455e460b9a13ccf19f15d07f4f00eb
  KIND_NODE_IMAGE: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
  KUBECTL_VERSION: v1.34.1
  KUBECTL_SHA256_AMD64: 7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3
  KUBECTL_SHA256_ARM64: 420e6110e3ba7ee5a3927b5af868d18df17aae36b720529ffa4e9e945aa95450

jobs:
  prepare:
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
      latest: ${{ steps.version.outputs.latest }}
      # 'true' when the dispatch asked for it; every later job skips then.
      dry_run: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate the release
        id: version
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.description }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] ||
            fail "version $VERSION is not vX.Y.Z."
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          [[ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]] || fail "release notes are empty."

          git fetch --tags --force origin
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            fail "$VERSION already exists."
          fi

          # The next version of an existing line: the patch after the newest
          # vX.Y.*, or the first of a new minor or major past the newest tag.
          line_latest=$(git tag -l "v${major}.${minor}.*" --sort=-v:refname | head -n1)
          newest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [[ -n "$line_latest" ]]; then
            [[ "$line_latest" =~ ^v[0-9]+\.[0-9]+\.([0-9]+)$ ]]
            want=$((BASH_REMATCH[1] + 1))
            [[ "$patch" -eq "$want" ]] ||
              fail "$VERSION skips or repeats: the next on v${major}.${minor} is v${major}.${minor}.${want} (after $line_latest)."
            base=$line_latest
          else
            [[ "$patch" -eq 0 ]] || fail "$VERSION starts a new line, so it must be v${major}.${minor}.0."
            IFS=. read -r newest_major newest_minor _ <<< "${newest#v}"
            next_minor="v${newest_major}.$((newest_minor + 1)).0"
            next_major="v$((newest_major + 1)).0.0"
            [[ "$VERSION" == "$next_minor" || "$VERSION" == "$next_major" ]] ||
              fail "$VERSION starts a line that isn't next: after $newest, a new line is $next_minor or $next_major."
            base=$newest
          fi

          # The commit must build on the release it follows: vX.Y.Z+1 must
          # contain vX.Y.Z, so code from an older line can't go out under a
          # newer line's number. This reads git history, not the branch's name.
          git merge-base --is-ancestor "$base" HEAD ||
            fail "$GITHUB_SHA doesn't contain $base, so it can't be released as $VERSION."

          # Only the newest line, released from main, may take GitHub's Latest.
          latest=false
          if [[ "$LATEST" == true ]]; then
            [[ "$GITHUB_REF_NAME" == main ]] || fail "only a release from main may be marked Latest; set latest=false."
            [[ "$(printf '%s\n%s\n' "$VERSION" "$newest" | sort -V | tail -n1)" == "$VERSION" ]] ||
              fail "$VERSION is older than $newest, so it can't be Latest; set latest=false."
            latest=true
          fi

          echo "Releasing $VERSION from $GITHUB_REF_NAME at $GITHUB_SHA (previous on this line: ${line_latest:-none}; base $base); Latest: $latest."
          {
            echo "version=$VERSION"
            echo "latest=$latest"
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          # Pull public base images (golang, alpine) anonymously via a
          # pull-through mirror. The scoped DOCKERHUB_TOKEN can push to our
          # repo but lacks pull scope on library/* images, so without this
          # buildkit's authenticated base-image pulls fail with 401.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: traversalext
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: production
          push: true
          sbom: true
          provenance: mode=max
          # Push an untagged manifest by digest. The version tag is attached only
          # after this exact digest has passed scanning and signing.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

  sign:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/public-sign-image.yml
    with:
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

  package-chart:
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install Helm
        run: |
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar --extract --gzip --strip-components=1 --directory=/usr/local/bin linux-amd64/helm
          helm version --short

      - name: Validate and package chart
        run: just chart-package "${{ needs.prepare.outputs.version }}"

      - name: Upload chart workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-chart
          path: |
            dist/*.tgz
            dist/*.tgz.sha256
          if-no-files-found: error
          retention-days: 1

  validate-chart-install:
    needs: [prepare, build, sign, package-chart]
    # The release image index carries linux/amd64 and linux/arm64; validate the
    # signed digest's startup on both, in parallel.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-chart
          path: dist

      - name: Pull pinned kind node image before scoped Docker Hub login
        run: docker pull "$KIND_NODE_IMAGE"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: traversalext
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install pinned cluster tools
        env:
          ARCH: ${{ matrix.arch }}
          HELM_SHA256: ${{ matrix.arch == 'arm64' && env.HELM_SHA256_ARM64 || env.HELM_SHA256_AMD64 }}
          KIND_SHA256: ${{ matrix.arch == 'arm64' && env.KIND_SHA256_ARM64 || env.KIND_SHA256_AMD64 }}
          KUBECTL_SHA256: ${{ matrix.arch == 'arm64' && env.KUBECTL_SHA256_ARM64 || env.KUBECTL_SHA256_AMD64 }}
        run: |
          set -euo pipefail
          # Download to a scratch dir and `sudo install`: the runner image ships
          # root-owned tools at these paths, so writing/chmodding them directly
          # fails with EPERM.
          curl --fail --location --silent --show-error \
            --output /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum --check
          tar --extract --gzip --strip-components=1 --directory=/tmp \
            --file=/tmp/helm.tgz "linux-${ARCH}/helm"
          sudo install -m 0755 /tmp/helm /usr/local/bin/helm

          curl --fail --location --silent --show-error \
            --output /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-${ARCH}"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

          curl --fail --location --silent --show-error \
            --output /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Validate packaged chart install and upgrade
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          (cd dist && sha256sum --check "traversal-connector-charts-${VERSION#v}.tgz.sha256")
          scripts/validate-chart-install.sh \
            "dist/traversal-connector-charts-${VERSION#v}.tgz" \
            --image-ref "${REGISTRY}/${IMAGE}@${DIGEST}"

  publish:
    needs: [prepare, build, sign, package-chart, validate-chart-install]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: traversalext
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials for the release mirror
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ env.PUBLIC_REPO_SIGNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Install Helm
        run: |
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar --extract --gzip --strip-components=1 --directory=/usr/local/bin linux-amd64/helm
          helm version --short

      - name: Download chart workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-chart
          path: dist

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.notes }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          ECR_MIRROR_REPOSITORY: ${{ secrets.ECR_MIRROR_REPOSITORY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          chart_version=${VERSION#v}
          chart="traversal-connector-charts-${chart_version}.tgz"
          checksum="${chart}.sha256"
          test -f "dist/$chart"
          test -f "dist/$checksum"
          (cd dist && sha256sum --check "$checksum")

          tag_cleanup_needed=false
          draft_created=false
          published=false
          cleanup() {
            status=$?
            if [[ "$status" -ne 0 && "$published" != true ]]; then
              if [[ "$draft_created" == true ]]; then
                echo "Removing incomplete draft release $VERSION."
                gh release delete "$VERSION" --yes || true
              fi
              if [[ "$tag_cleanup_needed" == true ]]; then
                echo "Rolling back Git tag $VERSION."
                git push origin ":refs/tags/$VERSION" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          git tag -a "$VERSION" -m "$NOTES"
          # Arm cleanup before the push to close the process-termination window;
          # deleting a remote ref that was never created is harmless.
          tag_cleanup_needed=true
          git push origin "$VERSION"

          gh release create "$VERSION" --draft --title "$VERSION" --notes "$NOTES" --verify-tag
          draft_created=true
          gh release upload "$VERSION" "dist/$chart" "dist/$checksum"

          asset_names=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
          test "$(printf '%s\n' "$asset_names" | grep -Fxc "$chart")" -eq 1
          test "$(printf '%s\n' "$asset_names" | grep -Fxc "$checksum")" -eq 1

          mkdir verified-assets
          gh release download "$VERSION" --dir verified-assets --pattern "$chart" --pattern "$checksum"
          test -f "verified-assets/$chart"
          test -f "verified-assets/$checksum"
          (cd verified-assets && sha256sum --check "$checksum")

          # Transitional compatibility mirror. Keep GitHub assets canonical,
          # but fail while the GitHub Release is still a draft if OCI
          # publication or verification does not succeed.
          scripts/publish-chart-oci.sh "verified-assets/$chart"

          # Apply the public image tag only after the draft contains verified
          # release assets. The digest was already scanned and signed. GitHub
          # and Docker Hub cannot publish transactionally: if publishing the
          # draft fails next, cleanup removes the draft and Git tag, but this
          # already-validated public image tag may remain for the retry.
          docker buildx imagetools create \
            --tag "${IMAGE_REF}:${VERSION}" \
            "${IMAGE_REF}@${DIGEST}"

          ecr_registry=${ECR_MIRROR_REPOSITORY%%/*}
          ecr_repository=${ECR_MIRROR_REPOSITORY#*/}
          echo "::add-mask::$ecr_registry"
          echo "::add-mask::$ecr_repository"
          [[ -n "$ecr_registry" && -n "$ecr_repository" ]]
          [[ "$ecr_registry" != "$ECR_MIRROR_REPOSITORY" ]]
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ecr_registry"

          describe_error=$(mktemp)
          if existing_digest=$(aws ecr describe-images \
            --region "$AWS_REGION" --repository-name "$ecr_repository" \
            --image-ids "imageTag=$VERSION" \
            --query 'imageDetails[0].imageDigest' --output text 2>"$describe_error"); then
            [[ "$existing_digest" == "$DIGEST" ]] || {
              echo "ECR release tag already has a different digest; refusing to overwrite." >&2
              exit 1
            }
          else
            grep -Fq 'ImageNotFoundException' "$describe_error" || {
              cat "$describe_error" >&2
              exit 1
            }
          fi
          cosign copy "${IMAGE_REF}@${DIGEST}" "${ECR_MIRROR_REPOSITORY}:${VERSION}"
          mirrored_digest=
          for attempt in {1..5}; do
            mirrored_digest=$(aws ecr describe-images \
              --region "$AWS_REGION" --repository-name "$ecr_repository" \
              --image-ids "imageTag=$VERSION" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            [[ "$mirrored_digest" == "$DIGEST" ]] && break
            [[ "$attempt" -eq 5 ]] || sleep 2
          done
          [[ "$mirrored_digest" == "$DIGEST" ]]
          cosign verify --key cosign.pub "${ECR_MIRROR_REPOSITORY}@${DIGEST}"
          rm -f "$describe_error"

          latest_flag=--latest=false
          if [[ "$LATEST" == true ]]; then
            latest_flag=--latest
          fi
          gh release edit "$VERSION" --draft=false "$latest_flag"
          published=true
          trap - EXIT

  # publish's own trap rolls back on a failing step, but a cancelled run can
  # stop it before the trap runs. This job runs whenever publish didn't
  # finish, and removes only what this run left half-made: a draft release, and
  # its tag if the tag points at this run's commit. A published release is
  # never touched.
  cleanup:
    needs: [prepare, publish]
    if: >
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.dry_run != 'true' &&
      (needs.publish.result == 'cancelled' || needs.publish.result == 'failure')
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Remove a half-made release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if draft=$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "$VERSION is published; leaving it."
              exit 0
            fi
            echo "Removing draft release $VERSION."
            gh release delete "$VERSION" --yes
          fi
          if tag_sha=$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}"); then
            if [[ "$tag_sha" == "$RUN_SHA" ]]; then
              echo "Removing tag $VERSION, made by this run."
              git push origin ":refs/tags/$VERSION"
            else
              echo "Tag $VERSION points at $tag_sha, not this run's $RUN_SHA; leaving it."
            fi
          fi
