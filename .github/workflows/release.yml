name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE: traversalext/traversal-connector

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            bump="${{ github.event.inputs.bump }}"
          elif echo "$LABELS" | jq -e '.[] | select(.name == "release:major")' > /dev/null; then
            bump=major
          elif echo "$LABELS" | jq -e '.[] | select(.name == "release:minor")' > /dev/null; then
            bump=minor
          else
            bump=patch
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump"

      - name: Compute new version
        id: version
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ steps.bump.outputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Previous: $latest -> New: $version"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          # Pull public base images (golang, alpine) anonymously via a
          # pull-through mirror. The scoped DOCKERHUB_TOKEN can push to our
          # repo but lacks pull scope on library/* images, so without this
          # buildkit's authenticated base-image pulls fail with 401.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v3
        with:
          username: traversalext
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: production
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}

      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
