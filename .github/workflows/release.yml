name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        type: choice
        options: [major, minor, patch]
        default: patch
      description:
        description: 'Description of the release (release notes)'
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE: traversalext/traversal-connector

jobs:
  prepare:
    # Run on manual dispatch, or when a PR is merged carrying a release:* label.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && (
        contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch')))
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Determine bump and release notes
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_DESC: ${{ github.event.inputs.description }}
          LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bump="$INPUT_BUMP"
            notes="$INPUT_DESC"
          else
            if echo "$LABELS" | jq -e '.[] | select(.name == "release:major")' > /dev/null; then
              bump='major'
            elif echo "$LABELS" | jq -e '.[] | select(.name == "release:minor")' > /dev/null; then
              bump='minor'
            else
              bump='patch'
            fi
            # Release notes are the top-level "# Release Notes" section of the PR
            # body, enforced by the Release Notes Check workflow. Fail loudly if
            # it is missing rather than publishing an arbitrary body as notes.
            section=$(printf '%s\n' "$PR_BODY" | .github/scripts/extract-release-notes.sh)
            if [[ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]]; then
              echo "::error::Merged PR has a release:* label but no non-empty '# Release Notes' section."
              exit 1
            fi
            notes="$section"
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute new version
        id: version
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ steps.meta.outputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Previous: $latest -> New: $version"

  build:
    needs: prepare
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          # Pull public base images (golang, alpine) anonymously via a
          # pull-through mirror. The scoped DOCKERHUB_TOKEN can push to our
          # repo but lacks pull scope on library/* images, so without this
          # buildkit's authenticated base-image pulls fail with 401.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: traversalext
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: production
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}

  sign:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: InteractionLabs/infrastructure/.github/workflows/sign-image.yaml@5cb7d88ad58f958cafcb7c4194ba5476e30268f2
    with:
      registry: docker.io
      repo: traversalext/traversal-connector
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      REGISTRY_USERNAME: traversalext
      REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

  publish:
    needs: [prepare, sign]
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$NOTES"
          git push origin "$VERSION"

          # If the release fails after the tag is pushed, roll the tag back so a
          # rerun recomputes the same version instead of orphaning it.
          if ! gh release create "$VERSION" --title "$VERSION" --notes "$NOTES" --verify-tag; then
            echo "::error::Failed to create GitHub Release; rolling back tag $VERSION."
            git push origin ":refs/tags/$VERSION" || true
            exit 1
          fi
