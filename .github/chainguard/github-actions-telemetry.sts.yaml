# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
# INFRA-1637: lets the github-actions-telemetry collector CronJob on the
# shared-resources cluster (helm/shared-resources-observability in
# InteractionLabs/infrastructure) read this repo's workflow runs and jobs, so
# CI build failures can be alerted on. Read-only; it never writes. The issuer
# changes if the cluster is recreated.
issuer: https://oidc.eks.us-west-2.amazonaws.com/id/6A0050026B709636C47806AD2E2DE60E
subject: system:serviceaccount:monitoring:github-actions-telemetry
permissions:
  actions: read
