# Traversal Connector — values template.
#
# All customer-specific fields are left blank. Required fields error at install
# time if not overridden. Optional fields are no-ops when blank.

image:
  repository: traversalext/traversal-connector
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 5

# limits.memory also sets Go's soft memory limit (GOMEMLIMIT) to 90% of it,
# through TRAVERSAL_MEMORY_LIMIT_BYTES, so the connector collects garbage
# before the kernel kills it. Without a memory limit Go's default stays.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "1"
    memory: 4Gi

# ─── Required ────────────────────────────────────────────────────────────────
# Customer environment label (e.g. "amex-prod"). Maps to ENV_NAME.
envName: ""
# ConnectRPC URL of the Traversal control plane. Maps to TRAVERSAL_CONTROLLER_URL.
controllerURL: ""
# Optional curl --connect-to-style host:port override for the controller. Only
# the TCP connection destination changes; controllerURL still supplies the
# scheme, path, HTTP/2 :authority, TLS SNI, and certificate verification.
# Tunnels follow it too unless pipes.tunnelsConnectTo is set. Cannot be
# combined with proxyURL.
controllerConnectTo: ""  # TRAVERSAL_CONTROLLER_CONNECT_TO
# Unique identifier for this connector deployment, provided to you by Traversal:
# a lower-case UUID, or the chart fails at render. Maps to TRAVERSAL_CONNECTOR_ID.
connectorID: ""

# ─── Optional connection tuning ──────────────────────────────────────────────
# All values left blank fall back to connector built-in defaults.
envLevel: ""               # ENV_LEVEL: production | development
# proxyURL is not supported by connector 0.10.x: tunnels cannot run through a
# forward proxy yet, so the chart refuses to render with it set. Stay on 0.9.x
# if you need it.
proxyURL: ""               # EGRESS_PROXY_URL: http forward proxy for SaaS egress
requestTimeout: ""         # REQUEST_TIMEOUT (default 60s)
maxRequestBodySizeMB: ""   # MAX_REQUEST_BODY_SIZE_MB (default 32)
# Ceilings on an upstream response, both enforced so redaction always scans the
# whole body: the wire ceiling caps what is read, and the decoded ceiling caps a
# gzip expansion, which the compressed length cannot predict. A response over
# either one is refused rather than forwarded unscanned.
maxResponseBodySizeMB: ""  # MAX_RESPONSE_BODY_SIZE_MB (default 32)
maxDecodedResponseBodySizeMB: ""  # MAX_DECODED_RESPONSE_BODY_SIZE_MB (default 256)
httpPort: ""               # HTTP_PORT (default 8080)

# ─── Tunnels and pipes ───────────────────────────────────────────────────────
# The connector holds tunnels to the controller's host on port 443 (TLS ALPN
# x-traversal-tunnel; a TLS-intercepting proxy breaks them). Traversal opens a
# pipe on a tunnel for each destination, carrying a Traversal-signed capability
# the connector checks before it dials. Needs controllerTLS and a lower-case
# UUID connectorID, and capability trust: trustedRoots, or capabilityKeys.
pipes:
  # Traversal's capability root certificates (PEM), the current root and,
  # during a root rotation, the next. Rendered together as
  # TRAVERSAL_CAPABILITY_ROOTS. With roots the connector trusts every
  # Traversal environment's signing key that a root certifies for this
  # connector's controller host, so it needs no capabilityIssuer or
  # capabilityKeys.
  trustedRoots:
    current: ""
    next: ""
  # Pinned keys, beside or instead of trustedRoots. capabilityKeys is a PEM
  # bundle of PUBLIC KEY blocks with Key-ID headers, raw or base64-encoded;
  # it needs capabilityIssuer.
  capabilityIssuer: ""     # TRAVERSAL_CAPABILITY_ISSUER
  capabilityKeys: ""       # TRAVERSAL_CAPABILITY_KEYS
  maxPipes: ""             # TRAVERSAL_PIPES_MAX (default 200)
  maxLifetime: ""          # TRAVERSAL_PIPES_MAX_LIFETIME (default 4h)
  idleTimeout: ""          # TRAVERSAL_PIPES_IDLE_TIMEOUT (default 15m)
  # HTTP/2 inside one pipe: concurrent requests, and the flow-control windows
  # per request and per pipe (KiB). They nest inside the tunnel's own.
  pipeMaxStreams: ""       # TRAVERSAL_PIPES_MAX_STREAMS (default 100)
  pipeStreamWindowKB: ""   # TRAVERSAL_PIPES_STREAM_WINDOW_KB (default 256)
  pipeConnectionWindowKB: ""  # TRAVERSAL_PIPES_CONNECTION_WINDOW_KB (default 1024)
  tunnelCount: ""          # TRAVERSAL_TUNNELS_COUNT (default 2, at most 8)
  # host:port to dial instead of <controller host>:443, such as a PrivateLink
  # endpoint; SNI and certificate checks still use the controller's host.
  # Unset, tunnels follow controllerConnectTo.
  tunnelsConnectTo: ""     # TRAVERSAL_TUNNELS_CONNECT_TO
  # An http:// forward proxy pipes reach their destinations through. Unset,
  # HTTPS_PROXY/HTTP_PROXY and NO_PROXY in the pod are used instead, for
  # backwards compatibility with #67, and that proxy resolves hostnames unless
  # egressProxyResolves is set; this is the documented setting.
  egressProxy: ""          # TRAVERSAL_PIPES_EGRESS_PROXY
  # Send hostnames to egressProxy, which resolves them. Off, only IP
  # literals go through it. Turn on only if the proxy refuses loopback,
  # link-local and metadata addresses.
  egressProxyResolves: ""  # TRAVERSAL_PIPES_EGRESS_PROXY_RESOLVES
  # Comma-separated CIDRs pipes may never reach, beside the built-in list
  # (loopback, link-local, metadata and the connector's own addresses), which
  # cannot be removed. An entry that does not parse stops the connector starting.
  forbiddenCIDRs: ""       # TRAVERSAL_PIPES_FORBIDDEN_CIDRS

# ─── mTLS to the Traversal control plane (required) ──────────────────────────
# The connector's client certificate: its tunnels cannot open without one, so
# the chart fails at render unless existingSecret, or certPEM and keyPEM, are
# set. Either provide PEM strings inline (chart will render a Secret) or
# reference an existing Secret with keys: tls.crt, tls.key, ca.crt (ca.crt is
# optional; without it the system roots verify the controller).
# Since v0.3.0, this same cert + key are also presented for mTLS to the OTLP
# telemetry endpoints when those endpoints are TLS-enabled.
controllerTLS:
  certPEM: ""              # → TLS_CERT_BASE64
  keyPEM: ""               # → TLS_KEY_BASE64
  caPEM: ""                # → TLS_CA_BASE64
  existingSecret: ""       # name of pre-existing Secret (overrides PEM fields)

# ─── Upstream TLS (validating customer observability endpoints) ──────────────
upstreamTLS:
  verify: true             # UPSTREAM_TLS_VERIFY
  caPEM: ""                # → UPSTREAM_TLS_CA_BASE64
  existingSecret: ""       # name of pre-existing Secret with key ca.crt
  caFile: ""               # → UPSTREAM_TLS_CA_FILE (path in container; excludes caPEM/existingSecret)

# ─── Telemetry (OTLP) ────────────────────────────────────────────────────────
# Telemetry is the only view Traversal has into a connector running inside your
# network: tunnel health, request outcomes, and the reason a connector stopped
# serving traffic all arrive this way.
#
# STRONGLY DISCOURAGED: setting this to true stops all export, and Traversal
# cannot diagnose or assist with issues in a deployment that reports nothing.
# It also disables the forwarder sidecar below.
disableTelemetry: false     # → TRAVERSAL_DISABLE_TELEMETRY (only set when true)

otel:
  serviceName: "traversal-connector"  # OTEL_SERVICE_NAME
  protocol: "grpc"                    # OTEL_EXPORTER_OTLP_PROTOCOL: grpc | http/protobuf | http/json

  # Optional curl --connect-to-style host:port override shared by logs, metrics,
  # and traces; all three logical endpoints must therefore be reachable through
  # this one socket. Only the TCP connection destination changes. The logical
  # URLs still supply scheme, path, HTTP Host/gRPC :authority, TLS SNI, and
  # certificate verification. Cannot be combined with proxyURL. With
  # sidecar.enabled, this changes Alloy's remote endpoint and is not passed to
  # the connector.
  connectTo: ""                       # OTEL_EXPORTER_OTLP_CONNECT_TO (direct export only)

  # Endpoints default to Traversal's hosted ingest — grpc to
  # telemetry.traversal.com:4317, http/* to telemetry.traversal.com/v1/{signal}.
  # Override all three to route through a collector you operate instead. Each
  # resolved endpoint must be an https:// URL, or install fails: unless
  # disableTelemetry is set, a connector that exports nowhere is not a supported
  # configuration.
  metricsEndpoint: ""      # OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
  tracesEndpoint: ""       # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
  logsEndpoint: ""         # OTEL_EXPORTER_OTLP_LOGS_ENDPOINT

  # ─── In-pod telemetry forwarder (optional) ─────────────────────────────────
  # When enabled, the connector sends all three signals — metrics, traces, and
  # logs — as OTLP over the pod loopback to a co-located forwarder sidecar. The
  # sidecar buffers them in a disk-backed queue and forwards to the otel
  # endpoints above over the connector's controllerTLS identity. Direct export
  # (below settings) is used when this is disabled.
  #
  # Egress is OTLP/gRPC: the otel.*Endpoint the sidecar forwards to must be a
  # gRPC OTLP endpoint, which is why an enabled sidecar defaults those endpoints
  # to the gRPC form regardless of otel.protocol — that setting governs only the
  # connector→sidecar loopback hop, not this egress. Only the defaults follow the
  # sidecar's transport, so an endpoint set explicitly here must be host:port
  # shaped; a path-bearing one is rejected at install.
  #
  # The queue is disk-backed on an emptyDir, so buffered telemetry survives a
  # sidecar process/container restart but is lost on pod eviction or reschedule
  # (the emptyDir is cleared) — it is not durable across node loss.
  #
  # The sidecar also forwards its own metrics and logs over the same egress,
  # under service.name=traversal-connector-telemetry-sidecar, so a forwarder
  # that is dropping or failing to export is visible rather than silent.
  sidecar:
    enabled: true
    image:
      repository: traversalext/alloy
      tag: "v1.18.0"
      pullPolicy: IfNotPresent
    port: 4318                                  # sidecar HTTP OTLP receiver and connector loopback target
    # A memory limit is required for the sidecar's memory_limiter to bound
    # against the cgroup rather than total node memory.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# ─── Remote configuration (opt-in) ──────────────────────────────────────────
# Uses the controller origin and /v1/config/<connectorID>; no endpoint override.
# Publish a valid config before enabling. Mutually exclusive with local redaction.
# When enabled, startup requires a valid document (including explicit rules=[]);
# a missing config or any other initial fetch failure blocks startup.
configUpdates:
  enabled: false
  refreshInterval: "30s"
  # Traversal's config signing keys, a Key-ID PEM bundle (the install command
  # sets it). Set, only configs Traversal signed for this connector apply,
  # while within their signed validity window (5 minutes' clock skew
  # allowed), each at a version above the config applied and issued no
  # earlier (the applied one re-sent is a no-op); empty, configs apply
  # unsigned. The floor is in memory only: after a restart the connector
  # accepts any validly signed config that has not expired, including an
  # older one, until it applies one, so the window bounds that replay.
  signingKeys: ""

# ─── Local-file redaction (opt-in) ───────────────────────────────────────────
# Set enabled: true and exactly one source. Cannot be combined with configUpdates.
# See the repository README for the local TOML format.
redaction:
  enabled: false
  # How many responses from covered hosts the connector buffers and redacts at
  # once, each holding up to maxResponseBodySizeMB plus
  # maxDecodedResponseBodySizeMB in memory. One that waits its whole
  # requestTimeout for a slot is refused (capacity). Applies to OTA rules too.
  maxConcurrent: ""  # TRAVERSAL_REDACTION_MAX_CONCURRENT (default 8, 1 to 1024)
  reloadInterval: "10s"
  # Inline TOML; the chart creates a ConfigMap.
  rulesContent: ""
  # An existing ConfigMap or Secret must contain the key redaction-rules.toml.
  existingConfigMap: ""
  existingSecret: ""

# Legacy inline TOML alias. A nonempty value enables local redaction.
# Cannot be combined with any redaction source above.
redactionRules: ""

# ─── Health probes ───────────────────────────────────────────────────────────
# Connector exposes /healthz (always 200 once HTTP server is up) and /readyz
# (200 only when at least one tunnel to the controller is active). Startup
# probe gives a long grace window for cold-start mTLS handshake; once it
# passes, liveness + readiness can run aggressively.
probes:
  startup:
    enabled: true
    failureThreshold: 30   # 30 × 5s = 150s grace before liveness kicks in
    periodSeconds: 5
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10

# ─── Pod / scheduling ────────────────────────────────────────────────────────
# A stopping connector takes at most about 30 s: up to 20 s for open pipes to
# finish, up to 5 s of HTTP shutdown, and 5 s for telemetry to flush. Keep this
# above that, or the pod is killed mid-drain.
terminationGracePeriodSeconds: 40

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# The connector needs no writable root filesystem or Linux capabilities.
# The telemetry sidecar has its own container security context.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
